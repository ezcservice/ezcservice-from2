<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ezy Credit Loan Application</title>

<style>
body{font-family:Arial;background:#f2f4f7;margin:0;}
.container{max-width:430px;margin:auto;background:#fff;padding:20px;}
h2{text-align:center;color:#0a3cff;}
.section{margin-top:25px;font-weight:bold;border-bottom:2px solid #eee;padding-bottom:5px;}
label{display:block;margin-top:12px;font-size:14px;}
input,textarea,select{
 width:100%;padding:10px;margin-top:5px;
 border-radius:8px;border:1px solid #ccc;
}
textarea{resize:none;}
button{
 width:100%;padding:14px;margin-top:20px;
 border:none;border-radius:10px;font-size:16px;
 cursor:pointer;
}
.submit-btn{background:#0a3cff;color:white;}
.whatsapp-btn{background:#25D366;color:white;}
.lang-btn{flex:1;padding:10px;border-radius:8px;border:1px solid #ccc;}
.en{display:none;} .si{display:block;}

.loader{display:none;text-align:center;margin-top:30px;}
.spinner{
 width:50px;height:50px;border:5px solid #ccc;
 border-top:5px solid #0a3cff;border-radius:50%;
 animation:spin 1s linear infinite;margin:auto;
}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.message{display:none;text-align:center;margin-top:25px;font-weight:bold;}
</style>
</head>

<body>
<div class="container">
<h2>Ezy Credit – ණය අයදුම් පත්‍රය</h2>

<form id="loanForm">

<div class="section">1️⃣ පුද්ගලික තොරතුරු</div>

<label>මුල් නම</label><input id="fname" required>
<label>අවසාන නම</label><input id="lname" required>
<label>ඊමේල්</label><input id="email">
<label>ජාතික හැඳුනුම්පත් අංකය</label><input id="nic" required>

<label>නගරය</label>
<select id="city">
<option>Colombo</option><option>Gampaha</option><option>Kandy</option>
<option>Kurunegala</option><option>Other</option>
</select>

<label>පදිංචි කාලය</label>
<select id="residence">
<option>Less than 1 year</option>
<option>1 – 3 Years</option>
<option>More than 3 Years</option>
</select>

<label>උපන් දිනය</label><input type="date" id="dob">
<label>WhatsApp අංකය</label><input id="appWhatsapp" required>

<div class="section">2️⃣ රැකියා තොරතුරු</div>

<label>රැකියා වර්ගය</label>
<select id="job">
<option>Government</option>
<option>Private</option>
<option>Self Employed</option>
<option>Business</option>
</select>

<label>මාසික ආදායම</label>
<select id="income">
<option>Below 50,000</option>
<option>50,000 – 100,000</option>
<option>Above 100,000</option>
</select>

<label>තනතුර</label><input id="designation">

<div class="section">3️⃣ ඇපකරුවන්ගේ තොරතුරු</div>

<label>පළමු ඇපකරුගේ නම</label><input id="g1name">
<label>දුරකථන අංකය</label><input id="g1phone">
<label>සබඳතාවය</label>
<select id="g1relation">
<option>Father</option><option>Mother</option>
<option>Brother</option><option>Friend</option>
</select>

<label>දෙවන ඇපකරුගේ නම</label><input id="g2name">
<label>දුරකථන අංකය</label><input id="g2phone">
<label>සබඳතාවය</label>
<select id="g2relation">
<option>Father</option><option>Mother</option>
<option>Brother</option><option>Friend</option>
</select>

<div class="section">4️⃣ ණය විස්තර</div>

<label>ලබා ගන්නා මුදල</label>
<select id="loanAmount">
<option>50,000</option><option>100,000</option>
<option>200,000</option><option>Other</option>
</select>

<label>ගෙවීම් කාලය</label>
<select id="repayment">
<option>3 Months</option>
<option>6 Months</option>
<option>12 Months</option>
</select>

<label>මුදල් ලබා ගැනීමට හේතුව</label>
<textarea id="purpose"></textarea>

<label>මීට පෙර ණය ලබාගෙන තිබේද?</label>
<select id="previousLoan">
<option>Yes</option><option>No</option>
</select>

<div class="section">5️⃣ ගෙවීම් ක්‍රම</div>

<label>Online ගෙවීම් තිබේද?</label>
<select id="onlinePay"><option>Yes</option><option>No</option></select>

<label>ළඟම බැංකුව</label><input id="bankNearby">

<label>Pay & Go මැෂින් තිබේද?</label>
<select id="paygo"><option>Yes</option><option>No</option></select>

<div class="section">6️⃣ ගිණුම් තොරතුරු</div>

<label>බැංකුව</label><input id="bankName">
<label>ශාඛාව</label><input id="branch">
<label>ගිණුම් අංකය</label><input id="accountNo">
<label>ගිණුම් හිමියාගේ නම</label><input id="accountHolder">

<button class="submit-btn">Submit</button>
</form>

<div class="loader" id="loader">
<div class="spinner"></div>
<p>කරුණාකර රැඳී සිටින්න...</p>
</div>

<div class="message" id="message">
<p>ඔබගේ විස්තර සාර්ථකව ලබාගෙන ඇත</p>
<button class="whatsapp-btn" onclick="sendWhatsApp()">WhatsApp හරහා යවන්න</button>
</div>
</div>

<script>
let msg="";
loanForm.addEventListener("submit",e=>{
e.preventDefault();

msg=`📌 *Ezy Credit ණය අයදුම් පත්‍රය*

👤 නම: ${fname.value} ${lname.value}
🆔 NIC: ${nic.value}
🏙 නගරය: ${city.value}
📱 WhatsApp: ${appWhatsapp.value}
🎂 උපන් දිනය: ${dob.value}

💼 රැකියාව: ${job.value}
💰 ආදායම: ${income.value}
📌 තනතුර: ${designation.value}

👥 ඇපකරු 1: ${g1name.value} (${g1phone.value}) - ${g1relation.value}
👥 ඇපකරු 2: ${g2name.value} (${g2phone.value}) - ${g2relation.value}

💵 ණය මුදල: ${loanAmount.value}
⏳ කාලය: ${repayment.value}
📝 හේතුව: ${purpose.value}
🔁 පෙර ණය: ${previousLoan.value}

🏦 බැංකුව: ${bankName.value}
🏧 ශාඛාව: ${branch.value}
🔢 ගිණුම් අංකය: ${accountNo.value}
👤 ගිණුම් හිමියා: ${accountHolder.value}`;

loanForm.style.display="none";
loader.style.display="block";

setTimeout(()=>{
 loader.style.display="none";
 message.style.display="block";
},8000);
});

function sendWhatsApp(){
 window.open("https://wa.me/94778630027?text="+encodeURIComponent(msg));
}
</script>
</body>
</html>
